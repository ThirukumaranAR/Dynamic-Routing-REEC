    function formatINR(amt) {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amt);

    // Progression: Manager -> Finance Head -> Accountant -> GM -> CEO
    function getNextStage(category, currentStage) {
      switch (currentStage) {
        case 'MANAGER':
          if (category === 'HR') return 'HR';
          if (category === 'IT' || category === 'Academic' || category === 'Training') return 'IT';
          if (category === 'Finance' || category === 'Procurement') return 'FINANCE';
          return 'FINANCE';
        case 'FINANCE':
          return 'ACCOUNTANT';
        case 'ACCOUNTANT':
        case 'HR':
        case 'IT':
          return 'GENERAL_MANAGER';
        case 'GENERAL_MANAGER':
          return 'CEO';
        case 'CEO':
          return 'COMPLETED';
        default:
          return 'COMPLETED';
      }
    }

    function isCurrentlyBusinessHours() {
      const now = new Date();
      const day = now.getDay();
      const isWeekday = day >= 1 && day <= 5;
      const hours = now.getHours() + now.getMinutes() / 60;
      return isWeekday && hours >= 9 && hours < 17;
    }

        case 'CEO': return 'Chairman / CEO';

      QUERIED: { bg: 'bg-orange-50', text: 'text-orange-700', dot: 'bg-orange-400' },

      const [selectedRequest, setSelectedRequest] = useState(null);
      const [statusFilter, setStatusFilter] = useState('ALL');

      const [selectedBranch, setSelectedBranch] = useState('FINANCE');
      const [selectedRole, setSelectedRole] = useState('REQUESTER');
      const [selectedInstitution, setSelectedInstitution] = useState('');
      const [showAddSingleModal, setShowAddSingleModal] = useState(false);
      const [showUserManager, setShowUserManager] = useState(false);

      // Success feedback state
      const [actionSuccessMsg, setActionSuccessMsg] = useState('');

      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('Academic');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [formAttachments, setFormAttachments] = useState([]);
      const [isCreated, setIsCreated] = useState(false);

      const [revisedTitle, setRevisedTitle] = useState('');
      const [revisedAmount, setRevisedAmount] = useState('');
      const [revisedDescription, setRevisedDescription] = useState('');
      const [responseExplanation, setResponseExplanation] = useState('');

      const [queryText, setQueryText] = useState('');

      const isBusinessTime = isCurrentlyBusinessHours();

      useEffect(() => {
        if (selectedRequest) {
          setRevisedTitle(selectedRequest.title);
          setRevisedAmount(selectedRequest.amount.toString());
          setRevisedDescription(selectedRequest.description);
          setResponseExplanation('');
          setActionSuccessMsg('');

          if (selectedRequest.category === 'HR') setSelectedBranch('HR');
          else if (selectedRequest.category === 'Finance' || selectedRequest.category === 'Procurement') setSelectedBranch('FINANCE');
          else setSelectedBranch('IT');
        }
      }, [selectedRequest]);

      const formatTimestamp = () => new Date().toLocaleString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const formatDate = () => new Date().toLocaleDateString('en-IN', { day: '2-digit', month: '2-digit', year: 'numeric' });

      const handleLogin = (e) => {
        e.preventDefault();
        const found = initialUsers.find(u => u.email.toLowerCase() === loginEmail.trim().toLowerCase() && u.password === loginPassword);
        if (found) {
          setCurrentUser(found);
          setPName(found.name);
          setPDept(found.dept);
          setPCampus(found.campus);
          setPRole(found.role);
          setActiveTab('dashboard');
          setAuthError('');
        } else {
          setAuthError('Invalid credentials.');
        }
      };

      const handleSignUp = (e) => {
        e.preventDefault();
        if (!suName.trim() || !suEmail.trim() || !suPassword.trim()) {
          setAuthError('Please fill in all fields.');
          return;
        }

        const newUser = {
          name: suName.trim(),
          email: suEmail.trim(),
          password: suPassword,
          role: suRole,
          dept: suDept.trim() || 'General Department',
          campus: suCampus.trim() || 'Main'
        };

        initialUsers.push(newUser);
        setCurrentUser(newUser);
        setPName(newUser.name);
        setPDept(newUser.dept);
        setPCampus(newUser.campus);
        setPRole(newUser.role);
        setActiveTab('dashboard');
        setAuthError('');
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        if (!pName.trim() || !pDept.trim()) return;

        const updated = {
          ...currentUser,
          name: pName.trim(),
          dept: pDept.trim(),
          campus: pCampus.trim() || 'Main',
          role: currentUser.role // Role is locked
        };

        const idx = initialUsers.findIndex(u => u.email.toLowerCase() === currentUser.email.toLowerCase());
        if (idx !== -1) {
          initialUsers[idx] = { ...initialUsers[idx], ...updated };
        }

        setCurrentUser(updated);
        setIsEditingProfile(false);
        setPSuccessMsg('Profile updated successfully!');

                      <p className="text-3xl font-bold text-blue-600 mb-1">2.8h</p>
                      <p className="text-xs text-slate-400">Within 6h Mon-Fri Business SLA</p>
                    </div>
                  </div>
                </div>
              )}

                                          {/* 7. My Profile (EDITABLE WITH ROLE LOCKED) */}
              {activeTab === 'my-profile' && (
                <div className="px-6 py-6 max-w-xl">
                  <div className="flex items-center justify-between mb-6">
                    <div>
                      <h1 className="text-2xl font-bold text-slate-900 tracking-tight">My Profile</h1>
                      <p className="text-xs text-slate-500 mt-0.5">Verified Institutional User Profile & System Credentials</p>
                    </div>
                    {!isEditingProfile && (
                      <button onClick={() => setIsEditingProfile(true)} className="flex items-center gap-1.5 bg-white border border-slate-200 hover:border-blue-500 hover:text-blue-600 text-slate-700 text-xs font-semibold px-3.5 py-1.5 rounded-lg transition shadow-2xs cursor-pointer">
                        <Icon name="profile" className="w-3.5 h-3.5" /> Edit Profile
                      </button>
                    )}
                  </div>

                  {pSuccessMsg && (
                    <div className="mb-4 bg-green-50 border border-green-200 text-green-700 text-xs font-medium px-4 py-2.5 rounded-lg flex items-center gap-2">
                      {pSuccessMsg}
                    </div>
                  )}

                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-2xs p-7">
                    <div className="flex items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                      <div className="w-16 h-16 rounded-full bg-blue-50 border border-blue-200 text-blue-700 font-bold text-xl flex items-center justify-center flex-shrink-0">
                        {currentUser.name.slice(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-xl font-bold text-slate-900">{currentUser.name}</h2>
                          <span className="bg-green-50 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-green-200">
                            ✓ Verified
                          </span>
                        </div>
                        <p className="text-xs font-bold text-blue-600 uppercase tracking-wider mt-0.5">{currentUser.role} — {getRoleDisplayName(currentUser.role)}</p>
                      </div>
                    </div>

                    {!isEditingProfile ? (
                      <div className="space-y-3">
                        {[
                          { label: 'Full Name', value: currentUser.name, icon: '👤' },
                          { label: 'Email Address', value: currentUser.email, icon: '✉️' },
                          { label: 'Department', value: currentUser.dept, icon: '🏢' },
                          { label: 'Campus', value: currentUser.campus || 'Main Campus', icon: '📍' },
                          { label: 'Enterprise Role', value: `${currentUser.role} (${getRoleDisplayName(currentUser.role)})`, icon: '🛡️' }
                        ].map(item => (
                          <div key={item.label} className="flex items-center justify-between py-2.5 border-b border-slate-100 last:border-0">
                            <span className="text-xs font-semibold text-slate-400 uppercase tracking-wide flex items-center gap-1.5">
                              <span>{item.icon}</span> {item.label}
                            </span>
                            <span className="text-sm text-slate-800 font-semibold">{item.value}</span>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <form onSubmit={handleSaveProfile} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Full Name *</label>
                          <input type="text" value={pName} onChange={e => setPName(e.target.value)} required className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address <span className="text-slate-400 font-normal">(Read-only)</span></label>
                          <input type="email" value={currentUser.email} disabled className="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm text-slate-400 cursor-not-allowed" />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Enterprise Role <span className="text-slate-400 font-normal">(Locked)</span></label>
                          <div className="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-xs text-slate-600 font-semibold flex items-center justify-between">
                            <span>{currentUser.role} — {getRoleDisplayName(currentUser.role)}</span>
                            <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-mono">🔒 Locked</span>
                          </div>
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Department *</label>
                            <input type="text" value={pDept} onChange={e => setPDept(e.target.value)} required className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Campus</label>
                            <input type="text" value={pCampus} onChange={e => setPCampus(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                          </div>
                        </div>
                        <div className="flex items-center gap-2 pt-3 border-t border-slate-100">
                          <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition cursor-pointer">Save Changes</button>
                          <button type="button" onClick={() => setIsEditingProfile(false)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-medium px-4 py-2 rounded-lg transition cursor-pointer">Cancel</button>
                        </div>
                      </form>
                    )}
                  </div>
                </div>
              )}
                          {/* 8. User Management (CEO ONLY - MATCHING REFERENCE DESIGN) */}
              {activeTab === 'user-management' && currentUser.role === 'CEO' && (
                <div className="p-8 max-w-6xl mx-auto space-y-7">
                  {/* Page Title & Subtitle */}
                  <div>
                    <h1 className="text-2xl font-bold text-slate-900 tracking-tight">
                      User Management
                    </h1>
                    <p className="text-sm text-slate-500 mt-1">
                      Create and manage user accounts.
                    </p>
                  </div>

                  {/* CARD 1: Create users */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-2xs p-6">
                    <div className="flex items-center justify-between mb-5">
                      <h2 className="text-base font-bold text-slate-900">
                        Create users
                      </h2>
                      <button
                        type="button"
                        onClick={() => setShowAddSingleModal(true)}
                        className="border border-blue-200 text-blue-600 bg-blue-50/60 hover:bg-blue-100 text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-2xs cursor-pointer inline-flex items-center gap-1"
                      >
                        + Add single
                      </button>
                    </div>

                    {/* Role & Institution Dropdowns Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1.5">
                          Role
                        </label>
                        <select
                          value={selectedRole}
                          onChange={e => setSelectedRole(e.target.value)}
                          className="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                        >
                          <option value="REQUESTER">Head of Department (Requester)</option>
                          <option value="MANAGER">Line Manager</option>
                          <option value="HR">HR Head</option>
                          <option value="IT">IT Head</option>
                          <option value="FINANCE">Finance Head</option>
                          <option value="ACCOUNTANT">Accountant</option>
                          <option value="GENERAL_MANAGER">General Manager</option>
                          <option value="CEO">Chief Executive Officer (CEO)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wide mb-1.5">
                          Institution
                        </label>
                        <select
                          value={selectedInstitution}
                          onChange={e => setSelectedInstitution(e.target.value)}
                          className="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer"
                        >
                          <option value="">Select institution</option>
                          <option value="SRM Institute of Science and Technology - Main Campus">SRM Institute of Science and Technology - Main Campus</option>
                          <option value="Easwari Engineering College (EEC)">Easwari Engineering College (EEC)</option>
                          <option value="SRM Easwari Campus - Ramapuram">SRM Easwari Campus - Ramapuram</option>
                          <option value="SRM Dental College">SRM Dental College</option>
                          <option value="SRM Arts & Science College">SRM Arts & Science College</option>
                          <option value="SRM Medical College & Research Institute">SRM Medical College & Research Institute</option>
                        </select>
                      </div>
                    </div>

                    {/* Bulk create via Excel Box */}
                    <div className="border border-dashed border-slate-300 rounded-xl p-5 bg-slate-50/40">
                      <h3 className="text-sm font-bold text-slate-800 mb-1.5">
                        Bulk create via Excel
                      </h3>
                      <p className="text-xs text-slate-500 leading-relaxed">
                        Columns: <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">name</span>, <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">employeeID</span>, <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">email</span>, <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">phone</span>, <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">department</span>. Rows without a department are skipped. Default password <span className="bg-slate-200/70 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[11px]">123456</span>.
                      </p>

                      {/* Warning Notice Bar */}
                      {!selectedInstitution ? (
                        <div className="bg-[#fffbeb] border border-[#fef3c7] text-[#92400e] text-xs px-4 py-2.5 rounded-lg my-4 flex items-center gap-2">
                          <span>Select an institution above before uploading.</span>
                        </div>
                      ) : (
                        <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs px-4 py-2.5 rounded-lg my-4 flex items-center justify-between">
                          <span>✓ Target Institution: <strong>{selectedInstitution}</strong></span>
                          <span className="text-[11px] bg-emerald-100 text-emerald-900 font-semibold px-2 py-0.5 rounded">Ready</span>
                        </div>
                      )}

                      {/* Action Buttons */}
                      <div className="flex items-center gap-3">
                        <label className="border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer shadow-2xs inline-flex items-center gap-2 transition">
                          <input
                            type="file"
                            accept=".xlsx,.xls,.csv"
                            onChange={(e) => {
                              if (!selectedInstitution) {
                                alert('Please select an institution above before uploading.');
                                if (e.target) e.target.value = '';
                                return;
                              }
                              const file = e.target.files?.[0];
                              if (file) {
                                alert(`Excel file '${file.name}' processed successfully for ${selectedInstitution}! User accounts created.`);
                                setShowUserManager(true);
                              }
                            }}
                            className="hidden"
                          />
                          Choose .xlsx file
                        </label>

                        <button
                          type="button"
                          onClick={() => {
                            const csvContent = 'name,employeeID,email,phone,department\nDr. Rajesh Sharma,EMP-1041,rajesh.sharma@srmist.edu.in,9876543210,Computer Science and Engineering\nProf. Anitha Krishnan,EMP-1042,anitha.k@srmist.edu.in,9876543211,Information Technology';
                            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = `user_template_${selectedRole}.csv`;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                          }}
                          className="text-blue-600 hover:text-blue-700 text-xs font-semibold cursor-pointer underline-offset-2 hover:underline inline-flex items-center gap-1"
                        >
                          Download template
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* CARD 2: Existing users */}
                  <div className="bg-white rounded-2xl border border-slate-200/80 shadow-2xs p-6">
                    <div className="flex items-center justify-between mb-2">
                      <h2 className="text-base font-bold text-slate-900">
                        Existing users
                      </h2>
                      <button
                        type="button"
                        onClick={() => setShowUserManager(!showUserManager)}
                        className="bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs px-4 py-2.5 rounded-lg transition shadow-2xs cursor-pointer"
                      >
                        {showUserManager ? 'Hide user list' : 'View / edit / delete users'}
                      </button>
                    </div>
                    <p className="text-xs text-slate-500">
                      Open the manager to browse every user you can manage, edit their details, or remove them.
                    </p>

                    {showUserManager && (
                      <div className="mt-6 pt-5 border-t border-slate-100">
                        <div className="border border-slate-200/80 rounded-xl overflow-hidden">
                          <table className="min-w-full divide-y divide-slate-100 text-left text-xs">
                            <thead className="bg-slate-50 text-slate-600 font-semibold uppercase text-[10px]">
                              <tr>
                                <th className="px-4 py-3">User & Email</th>
                                <th className="px-4 py-3">Role</th>
                                <th className="px-4 py-3">Department</th>
                                <th className="px-4 py-3 text-right">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 bg-white">
                              {initialUsers.map((u) => (
                                <tr key={u.email} className="hover:bg-slate-50/60 transition">
                                  <td className="px-4 py-3">
                                    <p className="font-bold text-slate-800">{u.name}</p>
                                    <p className="text-slate-400 text-[11px]">{u.email}</p>
                                  </td>
                                  <td className="px-4 py-3">
                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">
                                      {getRoleDisplayName(u.role)}
                                    </span>
                                  </td>
                                  <td className="px-4 py-3 text-slate-600">{u.dept}</td>
                                  <td className="px-4 py-3 text-right">
                                    <span className="text-slate-400 text-[11px]">Active</span>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>

          {viewingDocument && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-2xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden border border-slate-200">
                <div className="bg-slate-800 text-white px-5 py-3 flex items-center justify-between flex-shrink-0">
                  <div className="flex items-center gap-2.5">
                    <div className="w-7 h-7 rounded bg-blue-600 flex items-center justify-center text-xs font-bold tracking-wider">DOC</div>
                    <div>
                      <p className="text-xs font-semibold text-slate-100">{viewingDocument.name}</p>
                      <p className="text-[10px] text-slate-400">{viewingDocument.size} · Official Institutional Proof</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-md flex items-center gap-1 cursor-pointer">Print</button>
                    <button onClick={() => setViewingDocument(null)} className="bg-slate-700 hover:bg-red-600 text-slate-200 hover:text-white p-1.5 rounded-md cursor-pointer">✕</button>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto bg-slate-100 p-6 flex justify-center">
                  <div className="bg-white border border-slate-200 shadow-md rounded-lg w-full p-8 text-slate-800 font-sans">
                    <div className="border-b-2 border-blue-600 pb-4 mb-5 flex items-start justify-between">
                      <div>
                        <h3 className="text-base font-bold text-slate-900 uppercase">SMART APPROVAL SYSTEM — ATTACHMENT PROOF</h3>
                        <p className="text-xs text-blue-600 font-semibold mt-0.5">Verified Departmental Supporting Document</p>
                      </div>
                      <div className="text-right text-xs">
                        <span className="bg-green-50 text-green-700 border border-green-200 font-semibold px-2 py-0.5 rounded text-[11px]">✓ Security Scanned</span>
                      </div>
                    </div>
                    <div className="space-y-4 text-xs leading-relaxed text-slate-700">
                      <div className="bg-slate-50 border border-slate-200 rounded-lg p-3.5">
                        <p className="font-semibold text-slate-800 mb-1">Document Details:</p>
                        <p className="text-slate-600"><strong>File Name:</strong> {viewingDocument.name}</p>
                        <p className="text-slate-600"><strong>File Size:</strong> {viewingDocument.size}</p>
                        <p className="text-slate-600"><strong>Format:</strong> {viewingDocument.type} Document</p>
                      </div>
                      <div className="border border-slate-100 rounded-lg p-4 bg-white text-center py-10">
                        <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3">
                          <Icon name="requests" className="w-6 h-6" />
                        </div>
                        <p className="font-semibold text-slate-800 text-sm">{viewingDocument.name}</p>
                        <p className="text-slate-500 text-xs mt-1 max-w-sm mx-auto">
                          Itemized vendor quotes, budgetary breakdown, and institutional credentials for multi-tier review.
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="bg-slate-50 border-t border-slate-200 px-5 py-3 flex items-center justify-end">
                  <button onClick={() => setViewingDocument(null)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer">Close Preview</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
